# Geliştirme ortamı (docker compose up ile otomatik yüklenir)
services:
  app:
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      # İmajda kurulan vendor/ klasörü bind-mount tarafından ezilmesin
      - /var/www/html/vendor
      - ./docker/php/php.ini-dev:/usr/local/etc/php/conf.d/zz-app.ini:ro

  db:
    volumes:
      # İlk açılışta yüklenir. Varsayılan boş şema; gerçek döküm (kişisel veri, repoya girmez) .env DB_INIT_SQL ile
      - ${DB_INIT_SQL:-./docker/db/init/01-schema.sql}:/docker-entrypoint-initdb.d/01-dump.sql:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
