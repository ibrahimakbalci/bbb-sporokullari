# Temel servis tanımı. Geliştirme: `docker compose up -d` (override otomatik yüklenir)
# Production: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: Europe/Istanbul
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db/init/02-migration.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  dbdata:
